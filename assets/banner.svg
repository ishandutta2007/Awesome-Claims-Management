<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Flow Line Gradient -->
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 44px; fill: #ffffff; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 19px; fill: #94a3b8; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #38bdf8; }
    
    /* Cross-browser compatible animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 0.5; }
    }

    @keyframes dashFlow {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes floatCard {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    .pulse-bg { animation: pulseGlow 4s ease-in-out infinite; }
    .animated-line { stroke-dasharray: 10 10; animation: dashFlow 12s linear infinite; }
    .floating-node-1 { animation: floatCard 4s ease-in-out infinite; }
    .floating-node-2 { animation: floatCard 5s ease-in-out infinite 1s; }
    .floating-node-3 { animation: floatCard 4.5s ease-in-out infinite 2s; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="300" fill="url(#bg-grad)" rx="16"/>

  <!-- Dynamic Glowing Orbs in Background (Right side) -->
  <circle cx="950" cy="150" r="140" fill="#8b5cf6" opacity="0.25" class="pulse-bg"/>
  <circle cx="1050" cy="80" r="90" fill="#3b82f6" opacity="0.25" class="pulse-bg"/>
  <circle cx="850" cy="220" r="80" fill="#ec4899" opacity="0.2" class="pulse-bg"/>

  <!-- Tech Grid / Process Flow Lines -->
  <g opacity="0.4">
    <path d="M 650 220 Q 800 120 950 200 T 1150 100" fill="none" stroke="url(#line-grad)" stroke-width="3" class="animated-line"/>
    <path d="M 600 80 Q 750 240 900 100 T 1180 220" fill="none" stroke="url(#line-grad)" stroke-width="2" class="animated-line"/>
  </g>

  <!-- Dynamic Claims Workflow Diagram Cards -->
  <g class="floating-node-1">
    <!-- FNOL Node -->
    <rect x="700" y="80" width="130" height="60" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" opacity="0.9"/>
    <text x="765" y="110" font-family="sans-serif" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="middle">FNOL Intake</text>
    <text x="765" y="128" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Automated Capture</text>
  </g>

  <g class="floating-node-2">
    <!-- AI Verification & Fraud Check Node -->
    <rect x="870" y="140" width="140" height="65" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" opacity="0.95"/>
    <text x="940" y="168" font-family="sans-serif" font-size="12" font-weight="bold" fill="#c084fc" text-anchor="middle">AI Rules &amp; Fraud</text>
    <text x="940" y="186" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Risk Scoring (0-100)</text>
  </g>

  <g class="floating-node-3">
    <!-- Payout Node -->
    <rect x="1040" y="80" width="120" height="60" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5" opacity="0.9"/>
    <text x="1100" y="110" font-family="sans-serif" font-size="12" font-weight="bold" fill="#34d399" text-anchor="middle">Fast Settlement</text>
    <text x="1100" y="128" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Digital Payouts</text>
  </g>

  <!-- Flow Arrows connecting nodes -->
  <path d="M 830 110 L 870 150" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.7"/>
  <path d="M 1010 160 L 1040 120" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.7"/>

  <!-- Foreground Content: Title & Subtitle -->
  <g transform="translate(60, 0)">
    <!-- Top Pill Category Badge -->
    <rect x="0" y="48" width="240" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="120" y="68" class="badge-text" text-anchor="middle">INSURTECH &amp; CLAIMS TECH</text>

    <!-- Main Title -->
    <text x="0" y="132" class="title">Awesome Claims Management</text>

    <!-- Accent Gradient Line under title -->
    <rect x="0" y="148" width="480" height="4" rx="2" fill="url(#accent-grad)"/>

    <!-- Subtitle -->
    <text x="0" y="188" class="subtitle">Curated SaaS Platforms, AI Engines &amp; Open-Source</text>
    <text x="0" y="214" class="subtitle">Claims Workflows for Insurance, MGAs &amp; Adjusters</text>
  </g>
</svg>
